name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  verificar-projeto:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar qualidade do código
        run: npm run lint

      - name: Testar build
        run: npm run build